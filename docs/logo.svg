<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Humanizexternity — humanize any measure in C#">
  <defs>
    <style>
      .wordmark { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-feature-settings: "lnum" 1; font-variant-numeric: lining-nums; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0907"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#262019" stroke-width="1"/>

  <g class="label" font-size="12" letter-spacing="3" fill="#8a7f6e">
    <text x="80" y="92">HUMANIZEXTERNITY</text>
    <text x="1120" y="92" text-anchor="end">C# · .NET 10 · NUGET</text>
  </g>

  <line x1="80" y1="120" x2="1120" y2="120" stroke="#262019" stroke-width="1"/>

  <text x="78" y="340" class="wordmark" font-size="220" letter-spacing="-8" fill="#f1ebe0">H13y</text>

  <text x="86" y="440" class="mono" font-size="16" letter-spacing="3" fill="#8a7f6e">humanize any measure</text>

  <text x="900" y="250" class="mono" font-size="32" letter-spacing="1" fill="#8a7f6e" text-anchor="middle">1024 MB</text>

  <g stroke="#e06c4a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="900" y1="280" x2="900" y2="305"/>
    <polyline points="890,295 900,307 910,295"/>
  </g>

  <text x="900" y="415" class="wordmark" font-size="88" letter-spacing="-2" fill="#f1ebe0" text-anchor="middle">1 GB</text>

  <line x1="80" y1="520" x2="1120" y2="520" stroke="#262019" stroke-width="1"/>

  <g class="mono" font-size="13" letter-spacing="1" fill="#4f463a">
    <text x="80" y="557">1500 g → 1.5 kg</text>
    <text x="1120" y="557" text-anchor="end">eduardoweb.us.ci</text>
  </g>
</svg>
